# Local development stack: `docker compose up --build`, then open http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sailprep
      POSTGRES_PASSWORD: sailprep
      POSTGRES_DB: sailprep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sailprep"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SAILPREP_DATABASE_URL: postgresql+psycopg://sailprep:sailprep@db:5432/sailprep
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
